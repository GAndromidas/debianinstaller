# Debian Installer — Package Configuration
# Defines package lists for different installation modes and desktop environments

# Apt packages common to all installation modes
apt:
  packages:
    - name: android-tools-adb
      description: "Android Debug Bridge"
    - name: android-tools-fastboot
      description: "Android fastboot tool"
    - name: bat
      description: "Cat clone with syntax highlighting"
    - name: btop
      description: "Resource monitor"
    - name: cmatrix
      description: "Matrix-style terminal animation"
    - name: cpufrequtils
      description: "CPU frequency scaling tools"
    - name: dosfstools
      description: "DOS filesystem utilities"
    - name: duf
      description: "Disk usage utility"
    - name: ffmpeg
      description: "Multimedia framework"
    - name: firefox
      description: "Web browser"
    - name: fonts-firacode
      description: "Fira Code programming font"
    - name: fonts-liberation
      description: "Liberation fonts"
    - name: fonts-noto-extra
      description: "Additional Noto fonts"
    - name: fwupd
      description: "Firmware update daemon"
    - name: fzf
      description: "Fuzzy finder"
    - name: gnome-disk-utility
      description: "Disk management utility"
    - name: gufw
      description: "Firewall management GUI"
    - name: hwinfo
      description: "Hardware information tool"
    - name: inxi
      description: "System information script"
    - name: ncdu
      description: "NCurses disk usage analyzer"
    - name: net-tools
      description: "Network configuration tools"
    - name: nmap
      description: "Network discovery and security auditing"
    - name: python3-pip
      description: "Python package installer"
    - name: samba
      description: "SMB/CIFS file and print server"
    - name: sl
      description: "Steam locomotive animation"
    - name: speedtest-cli
      description: "Internet speed test tool"
    - name: sshfs
      description: "FUSE-based SSH filesystem"
    - name: unrar
      description: "RAR archive extractor"
    - name: unzip
      description: "ZIP archive extractor"
    - name: wget
      description: "File download tool"
    - name: wmctrl
      description: "Window management tool"
    - name: xdg-desktop-portal-gtk
      description: "GTK backend for XDG Desktop Portal"
    - name: zoxide
      description: "Smarter cd command"

# Mode-specific package additions
essential:
  desktop:
    packages:
      - name: ttf-mscorefonts-installer
        description: "Microsoft Core Fonts"
      - name: vlc
        description: "Media player"
  server:
    packages:
      - name: bat
        description: "Cat clone with syntax highlighting"
      - name: btop
        description: "Resource monitor"
      - name: cmatrix
        description: "Matrix-style terminal animation"
      - name: curl
        description: "File transfer tool"
      - name: duf
        description: "Disk usage utility"
      - name: fwupd
        description: "Firmware update daemon"
      - name: fzf
        description: "Fuzzy finder"
      - name: git
        description: "Version control system"
      - name: hwinfo
        description: "Hardware information tool"
      - name: inxi
        description: "System information script"
      - name: ncdu
        description: "NCurses disk usage analyzer"
      - name: net-tools
        description: "Network configuration tools"
      - name: nmap
        description: "Network discovery and security auditing"
      - name: openssh-server
        description: "SSH server"
      - name: samba
        description: "SMB/CIFS file and print server"
      - name: sl
        description: "Steam locomotive animation"
      - name: speedtest-cli
        description: "Internet speed test tool"
      - name: sshfs
        description: "FUSE-based SSH filesystem"
      - name: unrar
        description: "RAR archive extractor"
      - name: unzip
        description: "ZIP archive extractor"
      - name: wget
        description: "File download tool"
      - name: zoxide
        description: "Smarter cd command"

# Distribution-specific packages
distributions:
  ubuntu:
    packages:
      - name: ubuntu-restricted-extras
        description: "Ubuntu restricted extras"
  linuxmint:
    packages:
      - name: ubuntu-restricted-extras
        description: "Ubuntu restricted extras"
  zorin:
    packages:
      - name: ubuntu-restricted-extras
        description: "Ubuntu restricted extras"
  debian:
    packages:
      - name: firmware-linux
        description: "Linux firmware"
      - name: firmware-linux-nonfree
        description: "Non-free Linux firmware"
  pop:
    packages:
      - name: pop-shell
        description: "Pop!_OS shell"

# Desktop environment specific packages
desktop_environments:
  gnome:
    install:
      - gnome-tweaks
    flatpak:
      - com.mattjakeman.ExtensionManager

# Packages not in repos — installed via GitHub fallback
fallback:
  packages:
    - name: eza
      description: "Modern ls replacement"
    - name: fastfetch
      description: "System information tool"
    - name: ripgrep
      description: "Fast grep replacement"
    - name: fd-find
      description: "Fast find replacement"

# Flatpak applications
flatpak:
  packages:
    - name: it.mijorus.gearlever
      description: "Graphical package manager for Flatpak"
